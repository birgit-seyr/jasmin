name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly on main, so the dependency audits run even in a week without a push:
  # a new advisory against main's dependencies shows up here.
  schedule:
    - cron: "17 5 * * 1"

# Cancel an in-flight run if a new commit lands on the same branch/PR.
# Saves CI minutes and surfaces only the freshest result on a PR. The event is
# part of the group so the weekly run never cancels a push run on main, whose
# result update.sh's deploy gate reads.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (type-check, lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jasmin-core/react-core
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: jasmin-core/react-core/.nvmrc
          cache: npm
          cache-dependency-path: jasmin-core/react-core/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        # Includes the size/complexity ratchet (max-lines, max-lines-per-function,
        # complexity). Files that already exceed a threshold are pinned
        # individually in eslint.hygiene-pins.js at their current worst value, so
        # they cannot grow and a new oversized function inside one still fails.
        run: npm run lint

      - name: Hygiene pins are exact
        # The step above enforces each pin as a ceiling but cannot see below one:
        # ESLint reports only what exceeds the configured number, so a file that
        # improves keeps its old pin and stays free to grow back to it. This
        # re-measures every pinned file with the rule floored and fails on a pin
        # above the value the file now reports, which makes the register ratchet
        # in both directions like the ruff and mypy baselines. It also names a pin
        # whose file is gone: pins are keyed by path, so a rename drops one
        # silently. See scripts/check-hygiene-pins.mjs.
        run: npm run lint:pins

      - name: Tests
        run: npm run test:run

      - name: Production build
        run: npm run build

      - name: Bundle size budget
        # Fails if a heavy dependency lands on the boot critical path (e.g. a
        # vendor lib pulled into the entry via a barrel re-export). Parses dist/index.html for the preloaded chunks and
        # checks gzip budgets. See scripts/check-bundle-size.mjs.
        run: npm run size

      - name: Security audit (npm, production deps only)
        # Fails on high/critical advisories in the SHIPPED (runtime) tree.
        # ``--omit=dev`` excludes dev tooling (lint/build/codegen vulns), which
        # are surfaced advisory-only in the step below. npm has no native
        # per-advisory ignore, so the script filters ``npm audit --json`` and
        # allow-lists specific advisories, each with its reason, in
        # scripts/check-prod-audit.mjs.
        run: node scripts/check-prod-audit.mjs

      - name: Security audit (npm, full tree — advisory only)
        # Reports dev-dep vulns for visibility but doesn't fail. Use the
        # run log to triage; Dependabot opens upgrade PRs weekly.
        run: npm audit --audit-level=high || true
        continue-on-error: true

  backend:
    name: Backend (pytest, black, ruff, mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jasmin-core/django-core

    # Postgres service for django-tenants tests. The schema setup happens at
    # session-scope inside the pytest fixtures (see apps/commissioning/tests/conftest.py).
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: jasmin
          POSTGRES_USER: jasmin
          POSTGRES_PASSWORD: jasmin
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Matches the test-fixture expectations + standard Django settings.
      DJANGO_SETTINGS_MODULE: config.settings
      # CI is a test environment, not a deploy: mark it DEBUG so the prod-only
      # boot guards (DJANGO_SECRET_KEY / FIELD_ENCRYPTION_KEY must not be the
      # dev defaults) don't fire for the manage.py subprocesses the suite spawns
      # (e.g. the ``spectacular`` schema contract test) or the schema-gen step
      # below — both run manage.py, which force-enables DEBUG only for
      # runserver and the shells. pytest
      # itself already defaults DEBUG on; this covers the child processes. The
      # real deploy sets DEBUG=False explicitly, so the fail-safe is intact.
      DEBUG: "True"
      POSTGRES_DB: jasmin
      POSTGRES_USER: jasmin
      POSTGRES_PASSWORD: jasmin
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      DJANGO_SECRET_KEY: ci-only-not-secret
      FIELD_ENCRYPTION_KEY: HeQ7tkqHP7nVB1hA7VkX0SVIan3y_NUFrjyeDnfzcXk=

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install Poetry
        # Match the version that maintains poetry.lock (lock-version 2.1). An
        # older Poetry (1.8.x) re-reads/rewrites the 2.1 lock in the 2.0 format
        # and re-resolves the whole graph — keep CI, the Dockerfile, and the
        # lock all on the same Poetry so lock ops stay minimal + reproducible.
        run: pipx install poetry==2.4.1

      - name: Verify lock is in sync with pyproject
        # Catches a dependency added/bumped in pyproject.toml without
        # re-locking — a drifted lock means "installs fine here, missing after a
        # clean image rebuild". Fails here instead of at Docker build / deploy.
        run: poetry check --lock

      - name: Configure Poetry cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles('jasmin-core/django-core/poetry.lock') }}

      - name: Install dependencies
        # ``pipx install poetry`` runs Poetry under the runner's DEFAULT Python
        # (3.12), and Poetry's interpreter auto-discovery doesn't reliably find
        # the 3.14 that setup-python installed — so it errors "3.12.3 is not
        # supported by the project (^3.14)". Point Poetry at the exact
        # interpreter via setup-python's ``python-path`` output before install.
        run: |
          poetry env use "${{ steps.setup-python.outputs.python-path }}"
          poetry install --no-interaction --no-ansi

      - name: Format check (black)
        run: poetry run black --check apps config core scripts

      - name: Lint (ruff, frozen baseline)
        # Runs the FULL rule set from pyproject.toml and fails on any finding not
        # already in jasmin-core/django-core/ruff-baseline.txt.
        #
        # The strict rules (E,F,B,BLE,UP,I) contribute ZERO baseline entries, so
        # anything they report is a hard failure. The hygiene rules (N naming,
        # C901 complexity, PLR0913/PLR0915 signature and function size) carry 201
        # accepted findings, held still by the baseline: blocking every PR on all
        # of them would stop delivery, refusing new ones does not.
        #
        # It also fails when the baseline lists a finding ruff no longer reports,
        # so the file can only shrink: fix findings, then run
        # ``poetry run python scripts/ruff_baseline.py freeze`` and commit it.
        run: poetry run python scripts/ruff_baseline.py check

      - name: Type check (mypy, frozen baseline)
        # Fails ONLY on findings that are not already in
        # jasmin-core/django-core/mypy-baseline.txt -- i.e. type errors this
        # change introduced. It also fails when the baseline lists findings mypy
        # no longer reports, so the file can only shrink: fix findings, then run
        # ``poetry run python scripts/mypy_baseline.py freeze`` and commit it.
        #
        # Why a baseline and not a clean run: type checking was switched on over
        # a codebase that predates it, so the first clean run had hundreds of
        # findings. Blocking every PR on all of them would have stopped delivery;
        # holding the count still and refusing new ones does not.
        run: poetry run python scripts/mypy_baseline.py check

      - name: Import contracts (backend layering)
        # CLAUDE.md's two one-way layering rules, enforced rather than assumed:
        # apps/commissioning must not import the feature apps (it is meant to be
        # extractable into its own project), and apps/shared must not reach back
        # up into them. ESLint's no-restricted-imports enforces the frontend half
        # of the same idea; this script is the backend half.
        #
        # The known extraction blockers -- the apps.notifications.jobs background
        # job infra and the read-only EmailLog query in members_viewsets -- are
        # named exemptions inside the script, each carrying its unwind plan. An
        # exemption that stops matching any real import is itself an error, so the
        # list ratchets down like the baselines above instead of lingering as
        # standing permission for the import to come back.
        #
        # Pure stdlib ast, no new dependency: import-linter would mean re-locking
        # the dependency graph for a gate this size.
        run: poetry run python scripts/import_contracts.py

      - name: Module length (backend, shrink-only)
        # A backend module has at most 1000 lines, the frontend's max-lines. The
        # modules already longer are pinned at their length in
        # jasmin-core/django-core/module-length-baseline.txt, and a pin only goes
        # down: a module that grows past its pin fails, and so does one that
        # shrank, until ``scripts/module_length.py freeze`` lowers its pin.
        run: poetry run python scripts/module_length.py check

      - name: Migrations are in sync with models
        # Catches a model field added/changed/removed without the matching
        # migration, i.e. the models and the migration files on disk disagree.
        # Without this the failure surfaces at DEPLOY time, when Django hits a
        # column the database doesn't have -- and prod migrations are
        # forward-only (see CLAUDE.md), so there is no reversing out of it.
        # Multi-tenant makes it worse: the missing migration then has to land
        # in every tenant schema.
        #
        # Plain ``makemigrations`` is correct here -- model definitions are
        # schema-independent; ``migrate_schemas`` is only for APPLYING them.
        #
        # Fix when this fails: run ``poetry run python manage.py
        # makemigrations`` locally and commit the generated migration(s).
        run: poetry run python manage.py makemigrations --check --dry-run

      - name: Tests (pytest)
        run: poetry run pytest --maxfail=5 -q

      - name: API schema is up-to-date
        # Regenerate the OpenAPI schema from the live serializer/viewset
        # code and fail if it differs from the committed ../react-core/schema.yml.
        # Catches "someone changed a serializer and forgot to run
        # `make generate-api`" before it ships as a silent frontend break.
        # Fix when this fails: run `make generate-api` locally and commit
        # both schema.yml + src/api/generated/ updates.
        run: |
          poetry run python manage.py spectacular --file ../react-core/schema.yml
          git diff --exit-code ../react-core/schema.yml

      - name: Security audit
        # Suppressed advisories — each one MUST carry its rationale HERE,
        # in full: why the risk was accepted and what would end the
        # suppression. No pointers to other files; they rot.
        #
        #   PYSEC-2025-183 (pyjwt) — disputed by upstream: "the key
        #     length is chosen by the application that uses the
        #     library". Our DJANGO_SECRET_KEY is long and random in prod
        #     (scripts/init-env.sh generates 64 random bytes; settings
        #     refuse to boot with the dev default), so the advisory does
        #     not apply to our usage.
        #     No patched release available; suppression is permanent
        #     unless the advisory's scope changes.
        #
        # Everything else gets FIXED, not suppressed — prefer raising the
        # version floor in pyproject.toml (see the pillow / pyjwt / pypdf
        # pins) over adding an --ignore-vuln here.
        run: poetry run pip-audit --strict --ignore-vuln PYSEC-2025-183

  gateway:
    name: Gateway (super-admin allowlist + nginx config)
    runs-on: ubuntu-latest
    # The super-admin platform host is protected first by an nginx IP
    # allowlist (super-admins skip 2FA on the strength of it — see
    # config/settings.py). Django repeats the check only when
    # SUPER_ADMIN_ALLOWED_IPS is set (SuperAdminIPAllowlistMiddleware), so this
    # job makes the infra control verifiable: a regression in the allowlist or
    # the dedicated server block fails here instead of silently leaving
    # super-admin password-only at deploy time.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify super-admin IP allowlist guardrail
        # Fail-closed deny-all terminal directive + dedicated super-admin
        # server block + allowlist include. Pure shell, no nginx needed.
        run: ./scripts/verify_super_admin_allowlist.sh

      - name: Validate rendered nginx config and the origin gate
        # Render the prod template the way the gateway service does
        # (nginx/render_config.sh), syntax-check it on the exact prod image and
        # serve it with the origin gate off and on, so a broken template, or a
        # gate that refuses every tenant or lets anyone in, is caught here
        # rather than in production.
        run: |
          docker run --rm \
            -v "$PWD/nginx:/work:ro" \
            -v "$PWD/scripts/check_gateway_config.sh:/check.sh:ro" \
            nginx:1.31-alpine sh /check.sh

  docker-smoke:
    name: Docker smoke (backend image builds + boots + serves)
    runs-on: ubuntu-latest
    # The ``backend`` job installs deps directly on the runner via Poetry — it
    # never exercises the Docker IMAGE, the entrypoint, or a from-scratch boot.
    # This job builds the real dev backend image and boots the stack (postgres +
    # redis + migrations + dev-tenant seed + runserver) until /health/ answers
    # 200, so a broken Dockerfile, a dependency missing from the lock, a failing
    # migration, or an entrypoint regression fails HERE instead of at
    # ``make dev-up`` on a developer's machine (or worse, at deploy).
    #
    # It cannot reproduce a STALE LOCAL venv volume (CI volumes are always
    # fresh — the `backend_venv_dev` mount repopulates from the built image);
    # that is precisely the point — a green run here is the "clean boot works"
    # baseline, so a local breakage is known to be environmental (fix locally
    # with `docker volume rm jasmin-platform_backend_venv_dev && make dev-up`).
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build + start backend (postgres, redis, migrations, runserver)
        # ``up backend`` also starts its depends_on (postgres, redis). The dev
        # compose is self-contained — every var has a ${VAR:-default}, so no
        # .env file is needed. Detached; the next step polls for readiness.
        run: docker compose -f docker-compose.dev.yml up -d --build backend

      - name: Wait for /health/ to return 200
        # Fresh-DB tenant migrations + the dev-tenant seed run before runserver,
        # so allow a few minutes. /health/ is answered by middleware BEFORE
        # tenant resolution, so it 200s with no tenant/auth. The backend maps
        # 127.0.0.1:8000 on the host.
        run: |
          timeout 300 bash -c '
            until [ "$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/health/)" = "200" ]; do
              echo "waiting for backend /health/ ..."
              sleep 5
            done
          '
          echo "backend is serving /health/ 200"

      - name: Dump backend logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.dev.yml ps
          docker compose -f docker-compose.dev.yml logs --no-color backend

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.dev.yml down -v

  prod-images:
    name: Production images (build + boot)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # docker-smoke boots the DEV image. Production runs other build stages: the
    # backend's runtime stage (non-root, gunicorn, collectstatic under
    # DEBUG=False behind the settings' boot guards), the frontend's nginx stage
    # with its asset-keeping start script, and the backup image. This job builds
    # them from the production compose file and boots them on production
    # settings, so a stage that breaks fails here instead of on the server after
    # `docker compose up -d`. The override only moves the logs to json-file.
    env:
      COMPOSE: docker compose -f docker-compose.yml -f .github/ci/docker-compose.prod-smoke.yml
      # Throwaway values for what the compose file and the settings' boot guards
      # require. None of them is a real secret; the keys are generated below.
      POSTGRES_DB: jasmin
      POSTGRES_USER: jasmin
      POSTGRES_PASSWORD: ci-postgres-password
      # The app's own database role, which postgres creates with the data
      # volume (postgres/app_db_role.sh): backend and huey migrate, provision
      # and serve without a superuser, as in production.
      APP_DB_USER: jasmin_app
      APP_DB_PASSWORD: ci-app-db-password
      REDIS_PASSWORD: ci-redis-password
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,.ci.example.test
      FRONTEND_DOMAIN: ci.example.test
      EMAIL_HOST: smtp.ci.example.test
      EMAIL_ADMIN: ops@ci.example.test
      BACKUP_ENCRYPTION_KEY: ci-backup-passphrase
      # Interpolated by the compose file for GlitchTip, which this job doesn't start.
      GLITCHTIP_DB_PASSWORD: ci-unused
      GLITCHTIP_SECRET_KEY: ci-unused
      GLITCHTIP_DOMAIN: https://glitchtip.ci.example.test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate throwaway keys
        run: |
          echo "DJANGO_SECRET_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "FIELD_ENCRYPTION_KEY=$(openssl rand -base64 32 | tr '+/' '-_')" >> "$GITHUB_ENV"
          echo "INVOICE_HASH_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Build the production images
        run: $COMPOSE build backend frontend backup

      - name: Boot backend, huey and frontend on production settings
        # --wait returns once each service's healthcheck passes and fails the
        # step if one doesn't within the timeout: the backend after its
        # migrations and collectstatic, huey after its first heartbeat, the
        # frontend once nginx serves.
        run: $COMPOSE up -d --no-build --wait --wait-timeout 900 backend huey frontend

      - name: The backend is ready (database and Redis reachable)
        run: |
          $COMPOSE exec -T backend python -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8000/health/ready/', timeout=10).read().decode())"

      - name: A tenant can be created (tenant migrations on the runtime image)
        # The runtime image is installed without the dev dependencies, which
        # every other job has; provisioning runs every tenant migration and
        # its data seeds there.
        run: |
          $COMPOSE exec -T backend python manage.py shell -c "from apps.shared.tenants.services import TenantService; TenantService().provision_tenant(schema_name='ci', name='CI farm', domain='farm.ci.example.test', admin_email='admin@ci.example.test', admin_password='$(openssl rand -base64 24)')"

      - name: The app logs in as its own role, which owns what it created
        run: |
          $COMPOSE exec -T backend python manage.py shell -c "from django.db import connection; cursor = connection.cursor(); cursor.execute('SELECT current_user::text, rolsuper FROM pg_roles WHERE rolname = current_user'); user, superuser = cursor.fetchone(); print(user, 'superuser' if superuser else 'no superuser'); assert user == 'jasmin_app' and not superuser"
          $COMPOSE exec -T postgres /docker-entrypoint-initdb.d/app_db_role.sh --check

      - name: The frontend serves the app
        run: $COMPOSE exec -T frontend sh -c 'wget -qO- http://127.0.0.1/ | grep -q "id=\"root\""'

      - name: The backup container boots and writes an encrypted dump
        # Started only now, once the database is migrated: its start-up run
        # dumps the database once before it installs its cron schedule, and
        # backup.sh discards a dump under its size floor, which an empty
        # database's would be. The backup service has no healthcheck, so the
        # dump file itself is the check.
        run: |
          $COMPOSE up -d --no-build backup
          timeout 300 sh -c 'until $COMPOSE exec -T backup sh -c "ls /backups/*.sql.gz.gpg" 2>/dev/null; do sleep 5; done'

      - name: The pre-deploy dump works
        # deploy.sh takes this dump before every migration and stops the deploy
        # when it fails; backup.sh exits non-zero unless the dump decrypts and
        # ends with pg_dump's completion line.
        run: $COMPOSE run --rm --no-deps -T backup predeploy

      - name: A restore swaps in a copy the app's role owns
        # restore.sh loads the dump as the app's role, which so owns the copy
        # it swaps in; the app then serves it, the tenant created above
        # included.
        run: |
          $COMPOSE stop backend huey
          dump="$($COMPOSE exec -T backup sh -c 'ls -t /backups/*_predeploy_*.sql.gz.gpg | head -1')"
          $COMPOSE exec -T -e CONFIRM_SWAP=1 backup sh /backups/restore.sh "$dump"
          $COMPOSE exec -T postgres /docker-entrypoint-initdb.d/app_db_role.sh --check
          $COMPOSE up -d --no-build --wait --wait-timeout 300 backend huey
          $COMPOSE exec -T backend python manage.py shell -c "from apps.shared.tenants.models import Tenant; assert Tenant.objects.filter(schema_name='ci').exists(), 'the restored database has no ci tenant'"
          $COMPOSE exec -T backend python -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8000/health/ready/', timeout=10).read().decode())"

      - name: The backend booted without errors
        # gunicorn logs a failed start-up step as [ERROR], Django's handlers as
        # "- ERROR"; both carry on serving, so the health checks above stay
        # green.
        run: |
          if $COMPOSE logs --no-color backend | grep -E '\[ERROR\]| - (ERROR|CRITICAL) |Traceback \(most recent call last\)'; then
            echo "The backend logged errors while booting (above)."
            exit 1
          fi

      - name: Show state and logs on failure
        if: failure()
        run: |
          $COMPOSE ps -a
          $COMPOSE logs --no-color backend huey frontend backup postgres

      - name: Tear down
        if: always()
        run: $COMPOSE down -v

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    # Backstop for the gitleaks pre-commit hook (.pre-commit-config.yaml): that
    # hook only protects developers who ran `pre-commit install` and can be
    # bypassed with `--no-verify`, so the secret scan is enforced here for
    # everyone too. The shared .gitleaks.toml (extends the default ruleset +
    # allowlists the known dev placeholders) drives both, and the version is
    # pinned to match the hook. Scans the working tree (gitleaks `dir`, which
    # skips .git/dist/node_modules via the config) and fails on any
    # non-allowlisted secret.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.28.0 \
            dir /repo --config=/repo/.gitleaks.toml --no-banner --redact --verbose
