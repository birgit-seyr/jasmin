version: 2
updates:
  # Backend Python deps
  - package-ecosystem: "pip"
    directory: "/jasmin-core/django-core"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "backend"]
    groups:
      patch-and-minor:
        update-types: ["minor", "patch"]
    # redis 8 (redis-py) is a breaking major — defer until we do that upgrade
    # deliberately. Minor/patch still flow through the group above.
    ignore:
      - dependency-name: "redis"
        update-types: ["version-update:semver-major"]
      # Django 6.x. We are deliberately on the 5.2 LTS line (security-supported
      # until April 2028), and django-tenants / the SHARED_APPS+TENANT_APPS
      # split is the kind of thing a Django major breaks quietly. Security
      # patches still arrive as 5.2.x through the group above — CVE-2026-15830
      # was fixed by 5.2.17 that way, no major needed. Remove this entry when
      # the Django 6 upgrade is scheduled deliberately.
      - dependency-name: "django"
        update-types: ["version-update:semver-major"]

  # Frontend npm deps
  - package-ecosystem: "npm"
    directory: "/jasmin-core/react-core"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "frontend"]
    groups:
      patch-and-minor:
        update-types: ["minor", "patch"]
    # Defer MAJOR bumps of dev-tooling we upgrade deliberately — each needs a
    # migration (eslint flat-config, vitest config API, MUI core 9). This stops
    # Dependabot re-opening the same red major PR every week; minor/patch for
    # these still flow through the group above. Remove an entry when you're
    # ready to do that upgrade.
    ignore:
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # Scoped eslint packages (@eslint/js, @eslint/eslintrc, …) share the flat-
      # config migration with `eslint` above, but the unscoped entry does NOT
      # match a scoped name — so their majors slipped through and reopened a red
      # PR every week. Defer them too until we do the eslint upgrade.
      - dependency-name: "@eslint/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@mui/icons-material"
        update-types: ["version-update:semver-major"]
      # React 19 is one migration, not five bumps: react, react-dom and the two
      # @types packages have to move together (react-dom 19 against react 18 is
      # an unsatisfiable peer combo), and react-leaflet 5 requires React 19.
      # Dependabot proposes them individually, so each one lands red on its own.
      # Defer all five until the React 19 upgrade is done deliberately.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-leaflet"
        update-types: ["version-update:semver-major"]
      # Orval 8 regenerates the WHOLE typed API client (src/shared/api/
      # generated). That output is a build artifact we regenerate with
      # `make generate-api` and review as a diff — never hand-merged — and CI
      # gates that it matches schema.yml. A bot PR carrying a regenerated
      # client from a new major is the wrong shape for that workflow.
      - dependency-name: "orval"
        update-types: ["version-update:semver-major"]
      # i18next 26 + i18next-http-backend 4 are ONE migration, not two bumps
      # (the backend plugin tracks the core's plugin API). Translation loading
      # is load-bearing: `de` is the fallbackLng, so a regression doesn't throw
      # — it renders raw key strings to users. Do both together, deliberately.
      - dependency-name: "i18next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "i18next-http-backend"
        update-types: ["version-update:semver-major"]
      # jsdom 25 -> 30 is five majors of the test ENVIRONMENT at once. Every
      # vitest suite runs on it, so a behavioural change surfaces as unrelated
      # test failures across the board. Upgrade on its own, not in a bot PR.
      - dependency-name: "jsdom"
        update-types: ["version-update:semver-major"]
      # Vite 8 needs the @vitejs/plugin-react and vitest majors ignored above,
      # so the three move together in one planned upgrade.
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      # TypeScript 7: i18next and msw don't accept it as a peer yet, so
      # `npm ci` fails. The e2e package stays on the same major.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # The React Compiler rules of the 6+ plugin report 98 findings here;
      # they get fixed in their own pass before the bump.
      - dependency-name: "eslint-plugin-react-hooks"
        update-types: ["version-update:semver-major"]
      # The UI library the whole app is built on; a major needs its own
      # migration with a visual check of every page.
      - dependency-name: "antd"
        update-types: ["version-update:semver-major"]

  # The Playwright end-to-end suite's own package (Playwright, TypeScript).
  - package-ecosystem: "npm"
    directory: "/jasmin-core/e2e"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    labels: ["dependencies", "ci"]
    groups:
      patch-and-minor:
        update-types: ["minor", "patch"]
    ignore:
      # Stays on react-core's TypeScript major.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # The types follow the Node in .nvmrc, not the newest release.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # GitHub Actions versions themselves
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels: ["dependencies", "ci"]

  # Base images of the images we build: python:*-slim (backend), node:*-alpine
  # and nginx:*-alpine (frontend), postgres:*-alpine (backup). Dependabot skips
  # a FROM whose image comes from a build ARG, so the Dockerfiles name them
  # literally. deploy.sh pulls the newest build of each tag on every deploy;
  # these PRs move the tags themselves.
  - package-ecosystem: "docker"
    directories:
      - "/jasmin-core/django-core"
      - "/jasmin-core/react-core"
      - "/backups"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "docker"]
    ignore:
      # The backup image's pg_dump must match the server's major version, so
      # it moves with the Postgres upgrade below, not on its own.
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
      # Node moves in the Dockerfile, both .nvmrc files and package.json
      # engines together, and only to an LTS release.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  # Images the compose files run as published (postgres, redis, nginx,
  # certbot, glitchtip, uptime-kuma, mailhog). The docker ecosystem reads
  # Dockerfiles only; compose files have their own.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "docker"]
    ignore:
      # A new Postgres major can't open the old data directory: it takes a dump
      # and restore (or pg_upgrade), planned together with the backup image.
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
      # Redis holds the Huey queue in its append-only file; upgrade a major
      # deliberately, like the redis-py client above.
      - dependency-name: "redis"
        update-types: ["version-update:semver-major"]
