# Internal nginx config for the production frontend container.
# Only serves the static SPA. The outer gateway handles TLS, /api, /admin,
# /static, /media routing.
server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Long-term cache for fingerprinted assets.
    # ``^~`` is load-bearing: as a PLAIN prefix this loses to the extension
    # regex below for every .js/.css, so every hashed asset silently shipped
    # 30 days instead of the intended immutable year. ``^~`` stops nginx from
    # even considering the regex once this prefix matches.
    location ^~ /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp|avif)$ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # A service worker must NOT be cached by intermediaries, and a missing one
    # must 404 rather than fall through to index.html (registration fails with
    # a text/html MIME error otherwise). This app ships no service worker
    # today; the 404 this produces IS the kill switch — a 404 on update-check
    # de-registers any worker a previous build left behind. Keep both.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }
    # NOTE: the web app manifest is NOT served from here. It is rendered per
    # tenant by the backend at /api/tenants/manifest.webmanifest, because one
    # built bundle is served to every tenant subdomain and a static file could
    # only carry platform branding. index.html links that route directly.

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        # CFG-6: self-serve baseline security headers so the SPA document isn't
        # bare if reached directly (not via the gateway). nginx add_header is
        # all-or-nothing per location, so these must live INSIDE location / next
        # to the Cache-Control above, not at server level. CSP + HSTS are left to
        # the gateway (single owner) to avoid duplicate/conflicting headers.
        add_header X-Content-Type-Options     "nosniff"        always;
        add_header X-Frame-Options            "SAMEORIGIN"     always;
        add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin"    always;
        add_header Permissions-Policy         "geolocation=(), microphone=(), camera=()" always;
    }
}
